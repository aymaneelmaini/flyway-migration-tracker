name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get Changelog Entry
        run: |
          mkdir -p ./build/tmp
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=./build/tmp/release_note.txt

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Patch Changelog
        run: ./gradlew patchChangelog

      - name: Create Changelog Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          BRANCH="changelog-update-$VERSION"

          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

          git checkout -b $BRANCH
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: patch changelog for $VERSION"
          git push --set-upstream origin $BRANCH

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Patched \`CHANGELOG.md\` for \`$VERSION\`." \
            --head $BRANCH \
            --base master

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file ./build/tmp/release_note.txt \
            ./build/distributions/*.zip
