name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get Changelog Entry
        run: |
          mkdir -p ./build/tmp
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=./build/tmp/release_note.txt

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Patch Changelog
        run: ./gradlew patchChangelog

      - name: Commit Updated Changelog
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: patch changelog for ${{ github.ref_name }}"
          git push origin HEAD:master

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file ./build/tmp/release_note.txt \
            ./build/distributions/*.zip
